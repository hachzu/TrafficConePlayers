<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: rgb(255, 255, 255);
        }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <div id="player-container"></div>
        <script>
            var player
            var playerReady = false;

            function onYouTubeIframeAPIReady() {
            player = new YT.Player("player-container", {
                width: "100%",
                height: "100%",
                videoId: "cY0qV7q9IC4",
                playerVars: {
                    autoplay: 1,
                    mute: 1,
                    playsinline: 1,
                    origin: window.location.origin
                },
                events: {
                    onReady: function(event) {
                        playerReady = true;
                        console.log("YouTube player ready");
                    }
                }
            });
        }

        function playYouTubeVideo() {
            if (playerReady) player.playVideo();
        }

        function pauseYouTubeVideo() {
            if (playerReady) player.pauseVideo();
        }

        // Volume: 0 to 100
        function setYouTubeVolume(value) {
            if (playerReady) {
                player.setVolume(value);
            }
        }

        function muteYouTubeVideo() {
            if (playerReady) player.mute();
        }

        function unmuteYouTubeVideo() {
            if (playerReady) player.unMute();
        }

        // Seek to a position in seconds
        function setTimeline(seconds) {
            if (playerReady) {
                player.seekTo(seconds, true);
            }
        }

        // Return current playback position in seconds
        function getYouTubeCurrentTime() {
            return playerReady ? player.getCurrentTime() : 0;
        }

        // Return total duration in seconds
        function getYouTubeDuration() {
            return playerReady ? player.getDuration() : 0;
        }

        var tag = document.createElement("script");
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);


        </script>
</html>
